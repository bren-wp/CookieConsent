name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Core and WordPress checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax and unit tests
        run: |
          node --version
          npm run check
          npm test
          npm run build:cdn
          test -s dist/cdn/v0.5.0/manifest.json
      - name: WordPress plugin PHP syntax
        run: php -l wordpress/brendigo-cookieconsent/brendigo-cookieconsent.php
      - name: Ensure WordPress plugin assets match the core
        run: |
          cmp packages/core/brendigo-cookieconsent.js wordpress/brendigo-cookieconsent/assets/brendigo-cookieconsent.js
          cmp packages/core/brendigo-cookieconsent.css wordpress/brendigo-cookieconsent/assets/brendigo-cookieconsent.css
          cmp packages/integrations/google-consent-basic.js wordpress/brendigo-cookieconsent/assets/google-consent-basic.js

  browser:
    name: Browser E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependency (CI only)
        run: npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3
      - name: Install browser and OS libraries
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser regression tests
        env:
          BCC_BROWSER: ${{ matrix.browser }}
        run: npm run test:browser

  php-compat:
    name: PHP ${{ matrix.php }} compatibility (isolated WP settings)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: PHP syntax and isolated plugin validation tests
        run: |
          php -v
          php -l wordpress/brendigo-cookieconsent/brendigo-cookieconsent.php
          php tests/wp-settings.php

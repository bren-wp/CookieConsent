name: Production CDN monitoring (opt-in)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  monitor:
    # Enable scheduled checks only after the site is genuinely deployed.
    # Set repository variable BCC_PRODUCTION_DEPLOYED=true in GitHub Settings.
    if: github.event_name == 'workflow_dispatch' || vars.BCC_PRODUCTION_DEPLOYED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify live website and immutable CDN manifests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist/hosting
          node tools/verify-deployment.mjs --website https://cookie.brendigo.com 2>&1 | tee dist/hosting/website.log
      - name: Verify CDN integrity
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist/hosting
          node tools/verify-deployment.mjs --cdn https://api.brendigo.com/cookieconsent/ 2>&1 | tee dist/hosting/cdn.log
      - name: Verify website DNS, TLS and headers
        if: always()
        run: node tools/verify-hosting.mjs --website https://cookie.brendigo.com
      - name: Verify CDN DNS, TLS and cache policy
        if: always()
        run: node tools/verify-hosting.mjs --cdn https://api.brendigo.com/cookieconsent/
      - name: Upload hosting diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cookieconsent-hosting-diagnostics
          path: dist/hosting/
          if-no-files-found: ignore

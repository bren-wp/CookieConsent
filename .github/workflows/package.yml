name: Package installers
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source
        run: |
          npm run check
          npm test
          npm run build:cdn
          test -s dist/cdn/v0.11.2/manifest.json
          php -l wordpress/brendigo-cookieconsent/brendigo-cookieconsent.php
          cmp packages/core/brendigo-cookieconsent.js wordpress/brendigo-cookieconsent/assets/brendigo-cookieconsent.js
          cmp packages/core/brendigo-cookieconsent.css wordpress/brendigo-cookieconsent/assets/brendigo-cookieconsent.css
          cmp packages/integrations/google-consent-basic.js wordpress/brendigo-cookieconsent/assets/google-consent-basic.js
      - name: Prepare WordPress.org submission candidate
        run: npm run build:wporg
      - name: Build deterministic ZIP installers
        run: |
          python3 tools/package.py
          python3 tools/package.py --verify
      - uses: actions/upload-artifact@v4
        with:
          name: cookieconsent-by-brendigo-installers
          path: |
            dist/cookieconsent-brendigo-standalone.zip
            dist/brendigo-cookieconsent-wordpress.zip
            dist/brendigo-cookieconsent-wordpress-org.zip
            dist/brendigo-cookieconsent-joomla.zip
            dist/brendigo-cookieconsent-drupal.zip
            dist/brendigo-cookieconsent-shopify-extension.zip
            dist/brendigo-cookieconsent-magento.zip
            dist/brendigo.ocmod.zip
            dist/brendigocookieconsent-prestashop.zip
            dist/brendigo-cookieconsent-cdn.zip
            dist/cookieconsent-brendigo-website.zip
          retention-days: 14
